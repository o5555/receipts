function verdict(m) {
  const rows = P.filter(p=>p.month===m.key);
  const covOk = m.coverage.every(c=>c.state===OK);
  const open = rows.filter(p=>p.avslutat.state!==OK);
  if (!covOk) return { cls:'none', short:'kan inte stängas', text:`Kan inte stängas: underlaget bevisar inte hela perioden. ${open.length} av ${rows.length} köp är dessutom öppna.` };
  if (open.length) return { cls:'wait', short:'köp återstår', text:`Perioden är täckt. ${open.length} av ${rows.length} köp återstår.` };
  return { cls:'ok', short:'kan stängas', text:'Perioden är täckt och alla köp är avslutade.' };
}
function coverage(m) {
  return `<div class="cov">${m.coverage.map(c=>`${pill(c)}<span class="t">${esc(c.src)}<small>${esc(c.note)}</small></span>`).join('')}</div>`;
}
function excDetail(p) {
  const e = p.exc; if (!e) return `<dl><dt>Källor</dt><dd>${STEPS.map(([k,l])=>`<b>${l}:</b> ${esc(p[k].source)}`).join('<br>')}</dd></dl>`;
  return `<dl>
    <dt>Vad saknas</dt><dd>${esc(e.missing)}</dd>
    <dt>Försökt</dt><dd><ul>${e.tried.map(t=>`<li><span class="mono">${t[0]}</span> ${esc(t[1])}. ${esc(t[2])}.</li>`).join('')}</ul></dd>
    <dt>Nästa steg</dt><dd>${esc(e.next)}</dd>
    <dt>Förebyggande</dt><dd>${esc(e.prevent)}</dd>
    <dt>Källor</dt><dd>${STEPS.map(([k,l])=>`<b>${l}:</b> ${esc(p[k].source)}`).join('<br>')}</dd>
  </dl>`;
}

/* ===== A: att göra, per person ===== */
function variantA() {
  let h = `<div class="group"><div class="group-header"><span class="group-label">Läget per månad</span></div><div class="list">`;
  MONTHS.forEach(m=>{ const v=verdict(m); h+=`<div class="row"><span class="when">${m.key}</span><div class="rmain"><span class="name">${m.name}${m.proof?'<small>provmånad</small>':''}</span><span class="help">${v.text}</span></div><div class="rside"><span class="pill p-${v.cls}">${v.short}</span></div></div>`; });
  h += `</div></div>`;
  const owners = ['Oscar','Nicolina','Odin','systemet'];
  const withExc = P.filter(p=>p.exc);
  owners.forEach(o=>{
    const items = withExc.filter(p=>p.exc.owner===o).sort((a,b)=>sevOrder[a.exc.sev]-sevOrder[b.exc.sev]);
    if (!items.length) return;
    const label = o==='systemet' ? 'Systemet väntar på' : o==='Oscar' ? 'Du gör' : o+' gör';
    h += `<div class="group"><div class="group-header"><span class="group-label">${label}</span><span class="group-count">${items.length} ${items.length===1?'punkt':'punkter'}</span>${o==='Nicolina'?'<span class="group-note">du vidarebefordrar</span>':''}</div><div class="list">`;
    items.forEach(p=>{
      h += `<div class="row"><span class="when">${p.date}<span class="amt">${sek(p.amount)}</span></span>
        <div class="rmain"><span class="name">${esc(p.vendor)}<small>${p.card} · ${esc(p.owner)}</small></span>
          <span class="help"><b>${o==='systemet'?'Väntar på':'Gör'}:</b> ${esc(p.exc.help)}</span>
          ${stat4(p)}
          <details><summary>vad som prövats, nästa steg, källor</summary><div class="detail">${excDetail(p)}</div></details>
        </div>
        <div class="rside"><span class="pill p-${p.exc.sev}">${p.exc.sev==='none'?'stoppar månaden':p.exc.sev==='wait'?'väntar på dig':'ingen hjälp behövs'}</span></div></div>`;
    });
    h += `</div></div>`;
  });
  const done = P.filter(p=>!p.exc);
  h += `<div class="group"><div class="group-header"><span class="group-label">Inget att göra</span><span class="group-count">${done.length} köp</span></div><div class="list">`;
  done.forEach(p=> h+=`<div class="row"><span class="when">${p.date}<span class="amt">${sek(p.amount)}</span></span><div class="rmain"><span class="name">${esc(p.vendor)}<small>${p.card}</small></span>${stat4(p)}<details><summary>källor</summary><div class="detail">${excDetail(p)}</div></details></div><div class="rside"></div></div>`);
  h += `</div></div>`;
  return h;
}

/* ===== B: ett köp per rad ===== */
let selB = null;
function variantB() {
  let h = '';
  MONTHS.slice().reverse().forEach(m=>{
    const v = verdict(m);
    h += `<div class="group"><div class="group-header"><span class="group-label">${m.name}${m.proof?' · provmånad':''}</span><span class="pill p-${v.cls}">${v.short}</span></div>${coverage(m)}
      <div class="tablewrap"><table><thead><tr><th>Datum</th><th>Leverantör</th><th>Belopp</th>${STEPS.map(s=>`<th>${s[1]}</th>`).join('')}<th>Väntar på</th></tr></thead><tbody>`;
    P.filter(p=>p.month===m.key).forEach(p=>{
      h += `<tr class="rowb ${selB===p.id?'sel':''}" data-id="${p.id}"><td class="mono">${p.date}</td><td>${esc(p.vendor)}<span class="src">${p.card} · ${esc(p.owner)}</span></td><td class="mono">${sek(p.amount)}</td>`;
      STEPS.forEach(([k])=> h+=`<td>${pill(p[k])}<span class="src">${esc(p[k].source)}</span></td>`);
      h += `<td>${p.exc?`<span class="pill p-owner">${esc(p.exc.owner)}</span>`:'<span class="src">ingen</span>'}</td></tr>`;
      if (selB===p.id) h += `<tr class="exp"><td colspan="8">${p.exc?`<p class="help" style="margin-bottom:8px"><b>Gör:</b> ${esc(p.exc.help)}</p>`:''}${excDetail(p)}</td></tr>`;
    });
    h += `</tbody></table></div></div>`;
  });
  return h;
}

/* ===== C: kan månaden stängas? ===== */
let selC = '2026-08';
function variantC() {
  let h = `<div class="months">`;
  MONTHS.forEach(m=>{
    const rows = P.filter(p=>p.month===m.key); const v = verdict(m);
    h += `<div class="mcard ${selC===m.key?'sel':''}" data-m="${m.key}"><div class="mtitle">${m.name}${m.proof?'<span class="pill p-owner">provmånad</span>':''}</div>
      <div class="verdict v-${v.cls}">${v.text}</div>${coverage(m)}`;
    STEPS.forEach(([k,l])=>{
      const c = {ok:0,none:0,na:0,wait:0}; rows.forEach(p=>c[p[k].state]++); const n = rows.length||1;
      h += `<div class="step"><span>${l}</span><div class="bar"><i class="ok" style="width:${c.ok/n*100}%"></i><i class="na" style="width:${c.na/n*100}%"></i><i class="wait" style="width:${c.wait/n*100}%"></i><i class="none" style="width:${c.none/n*100}%"></i></div>
        <span class="n">${c.ok} klart${c.na?`, ${c.na} ej tillämpl.`:''}${c.none?`, <em>${c.none} saknar evidens</em>`:''}${c.wait?`, ${c.wait} väntar`:''}</span></div>`;
    });
    h += `</div>`;
  });
  h += `</div>`;
  const m = MONTHS.find(x=>x.key===selC);
  const open = P.filter(p=>p.month===m.key && p.avslutat.state!==OK);
  const cov = m.coverage.filter(c=>c.state!==OK);
  h += `<div class="group"><div class="group-header"><span class="group-label">Det som stoppar ${m.name.toLowerCase()}</span><span class="group-count">${cov.length+open.length} punkter</span></div><div class="list">`;
  if (cov.length) h += `<div class="row"><span class="when">period</span><div class="rmain"><span class="name">Underlaget täcker inte hela månaden</span><span class="help"><b>Gör:</b> ${esc(m.help||'Ingen.')}</span>${coverage(m)}</div><div class="rside"><span class="pill p-none">stoppar månaden</span></div></div>`;
  open.forEach(p=>{
    h += `<div class="row"><span class="when">${p.date}<span class="amt">${sek(p.amount)}</span></span><div class="rmain"><span class="name">${esc(p.vendor)}<small>${p.card} · ${esc(p.owner)}</small></span>
      ${p.exc?`<span class="help"><b>${p.exc.owner==='Oscar'?'Gör':p.exc.owner+' gör'}:</b> ${esc(p.exc.help)}</span>`:'<span class="help">Väntar bara på att perioden får täckning.</span>'}
      ${stat4(p)}<details><summary>vad som prövats, nästa steg, källor</summary><div class="detail">${excDetail(p)}</div></details></div>
      <div class="rside">${p.exc?`<span class="pill p-owner">${esc(p.exc.owner)}</span>`:''}</div></div>`;
  });
  if (!cov.length && !open.length) h += `<div class="row"><span class="when"></span><div class="rmain"><span class="help">Inget.</span></div></div>`;
  h += `</div></div>`;
  return h;
}

/* ===== switcher ===== */
const VARIANTS = { A:variantA, B:variantB, C:variantC };
const INTRO = {
  A:'<b>Att göra, per person.</b> Först läget per månad, sedan allt som återstår sorterat på vem som måste göra något. Varje punkt börjar med vad du ska göra.',
  B:'<b>Ett köp per rad.</b> Fyra statusar per köp, var och en med sin källa. Grått är ej tillämpligt, rött saknar evidens, gult väntar på ett svar. Klicka en rad för detaljer.',
  C:'<b>Kan månaden stängas?</b> Först måste underlaget täcka hela perioden, sedan måste varje köp ha sina steg verifierade. Klicka en månad för det som stoppar den.'
};
function current() { const v=(new URLSearchParams(location.search).get('variant')||'A').toUpperCase(); return VARIANTS[v]?v:'A'; }
function go(v) { const u=new URL(location); u.searchParams.set('variant',v); history.replaceState(null,'',u); render(); }
function render() {
  const v = current();
  document.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('active',b.dataset.v===v));
  document.getElementById('intro').innerHTML = INTRO[v];
  const openN = P.filter(p=>p.exc).length;
  document.getElementById('count').textContent = `${P.length} köp · ${openN} öppna`;
  document.getElementById('view').innerHTML = VARIANTS[v]();
  document.querySelectorAll('tr.rowb').forEach(tr=>tr.onclick=()=>{ selB = selB===tr.dataset.id?null:tr.dataset.id; render(); });
  document.querySelectorAll('.mcard').forEach(c=>c.onclick=()=>{ selC=c.dataset.m; render(); });
}
document.querySelectorAll('.filter-btn').forEach(b=>b.onclick=()=>go(b.dataset.v));
document.addEventListener('keydown',e=>{
  if (/INPUT|TEXTAREA/.test(document.activeElement.tagName)||document.activeElement.isContentEditable) return;
  const order=['A','B','C'], i=order.indexOf(current());
  if (e.key==='ArrowRight') go(order[(i+1)%3]); if (e.key==='ArrowLeft') go(order[(i+2)%3]);
});
render();
</script>
